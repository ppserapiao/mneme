name: smoke

# The smoke test verifies the published `@mnemehq/*` packages end-to-end
# (fresh `bun add` from npm + full SDK lifecycle + encryption-at-rest +
# BIP-39 recovery + WebSocket pairing + WebSocket sync + distiller).
#
# It's the single artefact that proves mneme works as a system from a
# consumer's perspective. We run it:
#   1. Nightly at 03:00 UTC, to catch silent npm-registry / dependency drift
#      between releases.
#   2. On every tag push (vX.Y.Z), so we never tag a release that doesn't
#      pass smoke.
#   3. Manually via workflow_dispatch when we need to verify in-flight work.
#
# We deliberately do NOT run smoke on every PR — it pulls from live npm
# (not the workspace source), so it's a release-gate signal, not a
# code-review signal. CI (lint/typecheck/test) covers source correctness.

on:
  schedule:
    - cron: "0 3 * * *"
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  smoke:
    name: smoke (live npm packages)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run smoke
        run: bun run smoke
